[workspace]
channels = ["conda-forge"]
name = "tracer_paper"
platforms = ["linux-64"]
version = "0.1.0"


[dependencies]
python = ">=3.13"
pip = "*"
numpy = "*"
pandas = "*"
xarray = "*"
tqdm = "*"
matplotlib = "*"
jinja2 = "*"
pint = "*"
black = "*"
fortls = "*"
pint-xarray = "*"
jupyter = "*"
jupyterlab = "*"
ipykernel = ">=7.2.0,<8"
h5py = "*"
dask = "*"
h5netcdf = "*"
bottleneck = "*"
netcdf4 = "*"
vtk = "*"
julia = "*"
arm_pyart = ">=2.1.1,<3"
scikit-image = ">=0.26.0,<0.27"
numba = ">=0.63.1,<0.64"
papermill = ">=2.7.0,<3"
ipython = ">=9.12.0,<10"
debugpy = ">=1.8.20,<2"
scikit-learn = ">=1.9.0,<2"
hdf5plugin = ">=7.1.0,<8"

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"

[pypi-dependencies]
ps = { path = "../ps", editable = true}
metpy = { path = "../MetPy_cd", editable = true}
carlee_tools = { path = "../carlee/carlee-tools", editable = true}
xarrams = { path = "../carlee/xarrams", editable = true}
skyvista = { path = "../carlee/skyvista", editable = true}
juliacall = "*"
